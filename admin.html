<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StakeWin Admin</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#050b08;
color:#f5faf7;
font-family:Arial,sans-serif;
padding:20px
}
.card{
max-width:800px;
margin:30px auto;
background:#0d1a13;
border:1px solid #294536;
border-radius:14px;
padding:20px
}
h1{margin-top:0}
input,button{
height:40px;
border-radius:7px;
border:1px solid #294536;
padding:0 12px;
font-size:14px
}
input{
background:#09130e;
color:white;
width:100%;
margin:5px 0
}
button{
background:#20df82;
color:#03130a;
font-weight:900;
cursor:pointer
}
.danger{
background:#ff5265;
color:white
}
.login button{
width:100%;
margin-top:8px
}
.admin{display:none}
.user{
border:1px solid #20372a;
border-radius:9px;
padding:12px;
margin:8px 0
}
.row{
display:flex;
gap:7px;
align-items:center;
flex-wrap:wrap
}
.row input{
width:150px;
margin:0
}
.name{
font-weight:900;
font-size:16px;
flex:1
}
.balance{
color:#20df82;
font-weight:900
}
.msg{
min-height:20px;
font-size:12px;
color:#ff5265;
margin:8px 0
}
.success{color:#20df82}
.logout{
float:right;
background:#17271f;
color:white
}
small{color:#789083}
</style>
</head>

<body>

<div class="card login" id="login">

<h1>STAKE<span style="color:#20df82">WIN</span> Admin</h1>

<small>Play-money credit management</small>

<input
id="adminUser"
placeholder="Admin username">

<input
id="adminPass"
type="password"
placeholder="Admin password">

<div id="loginMsg" class="msg"></div>

<button onclick="adminLogin()">LOGIN</button>

</div>


<div class="card admin" id="panel">

<button
class="logout"
onclick="logoutAdmin()">
LOG OUT
</button>

<h1>Admin Panel</h1>

<small>Manage player credits</small>

<hr style="border-color:#20372a;margin:18px 0">

<h3>Add Credits</h3>

<input
id="newUser"
placeholder="Username">

<input
id="newAmount"
type="number"
min="1"
placeholder="Credits amount">

<button onclick="addCredits()">
ADD CREDITS
</button>

<div id="actionMsg" class="msg"></div>

<hr style="border-color:#20372a;margin:18px 0">

<h3>Users</h3>

<div id="users"></div>

</div>


<script>

const USERS_KEY="stakewin_users";

/*
IMPORTANT:
This is a client-side demo admin.
It is NOT secure for real-money systems.
*/

const ADMIN_USER="admin";
const ADMIN_PASS="#12Atharv";


function getUsers(){

try{
return JSON.parse(
localStorage.getItem(USERS_KEY)||"{}"
);
}catch{
return {};
}

}


function saveUsers(users){

localStorage.setItem(
USERS_KEY,
JSON.stringify(users)
);

}


function adminLogin(){

const u=
document.getElementById("adminUser").value.trim();

const p=
document.getElementById("adminPass").value;

const msg=
document.getElementById("loginMsg");

if(
u!==ADMIN_USER||
p!==ADMIN_PASS
){

msg.innerText="Invalid admin login.";
return;

}

sessionStorage.setItem(
"stakewin_admin",
"1"
);

document.getElementById(
"login"
).style.display="none";

document.getElementById(
"panel"
).style.display="block";

renderUsers();

}


function logoutAdmin(){

sessionStorage.removeItem(
"stakewin_admin"
);

location.reload();

}


function addCredits(){

const username=
document.getElementById("newUser").value.trim();

const amount=
Number(
document.getElementById("newAmount").value
);

const msg=
document.getElementById("actionMsg");

msg.className="msg";

if(!username){

msg.innerText="Enter a username.";
return;

}

if(!amount||amount<=0){

msg.innerText="Enter a valid credit amount.";
return;

}

const users=getUsers();

if(!users[username]){

msg.innerText="User does not exist.";
return;

}

users[username].balance=
Number(users[username].balance||0)+amount;

saveUsers(users);

msg.className="msg success";

msg.innerText=
`${amount} credits added to ${username}.`;

document.getElementById(
"newUser"
).value="";

document.getElementById(
"newAmount"
).value="";

renderUsers();

}


function removeCredits(username){

const amount=
Number(
prompt(
`Credits to remove from ${username}:`
)
);

if(!amount||amount<=0)return;

const users=getUsers();

if(!users[username])return;

users[username].balance=
Math.max(
0,
Number(users[username].balance||0)-amount
);

saveUsers(users);

renderUsers();

}


function resetCredits(username){

if(
!confirm(
`Set ${username}'s credits to 0?`
)
)return;

const users=getUsers();

if(!users[username])return;

users[username].balance=0;

saveUsers(users);

renderUsers();

}


function renderUsers(){

const users=getUsers();

const box=
document.getElementById("users");

const names=
Object.keys(users);

if(!names.length){

box.innerHTML=
"<p><small>No users created yet.</small></p>";

return;

}

box.innerHTML=
names.map(username=>{

const balance=
Number(
users[username].balance||0
);

return `

<div class="user">

<div class="row">

<div class="name">
${escapeHTML(username)}
</div>

<div class="balance">
${balance.toLocaleString()} credits
</div>

</div>

<div class="row" style="margin-top:9px">

<button
onclick="addQuick('${encodeURIComponent(username)}',100)">
+100
</button>

<button
onclick="addQuick('${encodeURIComponent(username)}',500)">
+500
</button>

<button
onclick="addQuick('${encodeURIComponent(username)}',1000)">
+1000
</button>

<button
class="danger"
onclick="removeCredits('${encodeURIComponent(username)}')">
REMOVE
</button>

<button
class="danger"
onclick="resetCredits('${encodeURIComponent(username)}')">
RESET
</button>

</div>

</div>

`;

}).join("");

}


function addQuick(encoded,amount){

const username=
decodeURIComponent(encoded);

const users=getUsers();

if(!users[username])return;

users[username].balance=
Number(users[username].balance||0)+amount;

saveUsers(users);

renderUsers();

}


function escapeHTML(text){

return text
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


if(
sessionStorage.getItem("stakewin_admin")==="1"
){

document.getElementById(
"login"
).style.display="none";

document.getElementById(
"panel"
).style.display="block";

renderUsers();

}

</script>

</body>
</html>
