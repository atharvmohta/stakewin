<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StakeWin Admin</title>

<style>
*{
box-sizing:border-box
}

body{
margin:0;
background:#050b08;
color:#f5faf7;
font-family:Arial,sans-serif;
padding:20px
}

.card{
max-width:800px;
margin:30px auto;
background:#0d1a13;
border:1px solid #294536;
border-radius:14px;
padding:20px
}

h1{
margin-top:0
}

input,button{
height:40px;
border-radius:7px;
border:1px solid #294536;
padding:0 12px;
font-size:14px
}

input{
background:#09130e;
color:white;
width:100%;
margin:5px 0;
outline:none
}

input:focus{
border-color:#20df82;
box-shadow:0 0 0 2px #20df8222
}

button{
background:#20df82;
color:#03130a;
font-weight:900;
cursor:pointer
}

button:active{
transform:scale(.97)
}

button:disabled{
opacity:.5;
cursor:not-allowed
}

.danger{
background:#ff5265;
color:white
}

.secondary{
background:#17271f;
color:white
}

.login button{
width:100%;
margin-top:8px
}

.admin{
display:none
}

.user{
border:1px solid #20372a;
border-radius:9px;
padding:12px;
margin:8px 0;
background:#0a1710
}

.row{
display:flex;
gap:7px;
align-items:center;
flex-wrap:wrap
}

.row input{
width:150px;
margin:0
}

.name{
font-weight:900;
font-size:16px;
flex:1;
word-break:break-word
}

.balance{
color:#20df82;
font-weight:900;
white-space:nowrap
}

.msg{
min-height:20px;
font-size:12px;
color:#ff5265;
margin:8px 0
}

.success{
color:#20df82
}

.logout{
float:right;
background:#17271f;
color:white
}

small{
color:#789083
}

hr{
border:0;
border-top:1px solid #20372a
}

.loading{
display:none;
text-align:center;
padding:15px;
color:#789083;
font-size:12px
}

.userActions{
margin-top:9px
}

.userActions button{
min-width:65px
}

.refresh{
margin-bottom:15px
}
</style>
</head>

<body>


<!-- =========================
     ADMIN LOGIN
========================= -->

<div class="card login" id="login">

<h1>
STAKE<span style="color:#20df82">WIN</span> Admin
</h1>

<small>
Virtual-credit demo management
</small>

<input
id="adminUser"
placeholder="Admin username"
autocomplete="username">

<input
id="adminPass"
type="password"
placeholder="Admin password"
autocomplete="current-password">

<div id="loginMsg" class="msg"></div>

<button
id="loginBtn"
onclick="adminLogin()">
LOGIN
</button>

</div>


<!-- =========================
     ADMIN PANEL
========================= -->

<div class="card admin" id="panel">

<button
class="logout"
onclick="logoutAdmin()">
LOG OUT
</button>

<h1>
Admin Panel
</h1>

<small>
Changes sync through Supabase.
</small>

<hr style="margin:18px 0">


<!-- =========================
     SET CREDITS
========================= -->

<h3>
Set Credits
</h3>

<input
id="newUser"
placeholder="Username"
autocomplete="off">

<input
id="newAmount"
type="number"
min="0"
step="1"
placeholder="New balance">

<button
onclick="setCredits()">
SET CREDITS
</button>

<div id="actionMsg" class="msg"></div>


<hr style="margin:18px 0">


<!-- =========================
     USERS
========================= -->

<div class="row">

<h3 style="margin:0;flex:1">
Users
</h3>

<button
class="secondary refresh"
onclick="renderUsers()">
↻ REFRESH
</button>

</div>

<div
id="loading"
class="loading">
Loading users...
</div>

<div id="users"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://ljfuowfocmnmowksfuvp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_smUQUWvB4rgac0afKMgmog_5YpFhowH";

const db = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
   ADMIN LOGIN
========================= */

const ADMIN_USER = "admin";
const ADMIN_PASS = "#12Atharv";

const ADMIN_SESSION_KEY =
"stakewin_admin";


/* =========================
   ELEMENT HELPERS
========================= */

function $(id){
return document.getElementById(id);
}


/* =========================
   MESSAGE
========================= */

function showMessage(
message,
success=false
){

const msg=$("actionMsg");

msg.className =
success
? "msg success"
: "msg";

msg.innerText=message;

}


/* =========================
   ADMIN LOGIN
========================= */

function adminLogin(){

const username =
$("adminUser").value.trim();

const password =
$("adminPass").value;

const msg =
$("loginMsg");

msg.className="msg";
msg.innerText="";


if(!username || !password){

msg.innerText =
"Enter admin username and password.";

return;

}


if(
username !== ADMIN_USER ||
password !== ADMIN_PASS
){

msg.innerText =
"Invalid admin login.";

return;

}


/* Save admin session */

sessionStorage.setItem(
ADMIN_SESSION_KEY,
"1"
);


/* Hide login */

$("login").style.display="none";


/* Show panel */

$("panel").style.display="block";


/* Load users */

renderUsers();

}


/* =========================
   LOGOUT
========================= */

function logoutAdmin(){

sessionStorage.removeItem(
ADMIN_SESSION_KEY
);

location.reload();

}


/* =========================
   GET USERS
========================= */

async function getUsers(){

try{

const {
data,
error
} = await db
.from("stakewin_users")
.select("username,balance")
.order("username");


if(error){

console.error(
"GET USERS ERROR:",
error
);

showMessage(
error.message || "Could not load users."
);

return [];

}


return data || [];

}catch(error){

console.error(error);

showMessage(
"Could not connect to database."
);

return [];

}

}


/* =========================
   SET CREDITS
========================= */

async function setCredits(){

const username =
$("newUser").value.trim();

const amount =
Number(
$("newAmount").value
);


showMessage("");


/* Validate username */

if(!username){

showMessage(
"Enter a username."
);

return;

}


/* Validate amount */

if(
!Number.isFinite(amount) ||
amount < 0
){

showMessage(
"Enter a valid amount."
);

return;

}


/* Disable button while updating */

const buttons =
document.querySelectorAll("button");

buttons.forEach(
b=>b.disabled=true
);


try{

/*
First check whether user exists
*/

const {
data:user,
error:userError
} = await db
.from("stakewin_users")
.select("username,balance")
.eq("username",username)
.maybeSingle();


if(userError){

console.error(
"USER CHECK ERROR:",
userError
);

showMessage(
userError.message ||
"Database error while checking user."
);

return;

}


if(!user){

showMessage(
"User does not exist."
);

return;

}


/*
Update balance
*/

const {
data,
error
} = await db
.from("stakewin_users")
.update({
balance:amount
})
.eq("username",username)
.select("username,balance");


if(error){

console.error(
"SET CREDIT ERROR:",
error
);

showMessage(
error.message ||
"Database error while updating balance."
);

return;

}


/*
Make sure update actually happened
*/

if(
!data ||
!data.length
){

showMessage(
"Balance was not updated. Check Supabase RLS policies."
);

return;

}


/*
Success
*/

showMessage(
`${username} balance set to ${amount} credits.`,
true
);


$("newUser").value="";
$("newAmount").value="";


/*
Refresh list
*/

await renderUsers();


}catch(error){

console.error(
"SET CREDITS EXCEPTION:",
error
);

showMessage(
error.message ||
"Unexpected database error."
);

}finally{

buttons.forEach(
b=>b.disabled=false
);

}

}


/* =========================
   QUICK CREDIT UPDATE
========================= */

async function quick(
username,
amount
){

if(!username){

showMessage(
"Invalid username."
);

return;

}


amount=Number(amount);


if(!Number.isFinite(amount)){

showMessage(
"Invalid credit amount."
);

return;

}


try{

/*
Get current balance
*/

const {
data:user,
error:userError
} = await db
.from("stakewin_users")
.select("username,balance")
.eq("username",username)
.maybeSingle();


if(userError){

console.error(
"QUICK GET ERROR:",
userError
);

showMessage(
userError.message ||
"Could not read user."
);

return;

}


if(!user){

showMessage(
"User does not exist."
);

return;

}


/*
Calculate new balance
*/

const oldBalance =
Number(user.balance || 0);

const newBalance =
oldBalance + amount;


/*
Update
*/

const {
data,
error
} = await db
.from("stakewin_users")
.update({
balance:newBalance
})
.eq("username",username)
.select("username,balance");


if(error){

console.error(
"QUICK UPDATE ERROR:",
error
);

showMessage(
error.message ||
"Could not update credits."
);

return;

}


if(
!data ||
!data.length
){

showMessage(
"Update was blocked. Check Supabase RLS policies."
);

return;

}


/*
Success
*/

showMessage(
`${username}: +${amount} credits → ${newBalance}`,
true
);


await renderUsers();


}catch(error){

console.error(
"QUICK ERROR:",
error
);

showMessage(
error.message ||
"Unexpected error."
);

}

}


/* =========================
   RESET CREDITS
========================= */

async function resetCredits(
username
){

if(
!confirm(
`Set ${username}'s credits to 0?`
)
){

return;

}


try{

const {
data,
error
} = await db
.from("stakewin_users")
.update({
balance:0
})
.eq("username",username)
.select("username,balance");


if(error){

console.error(
"RESET ERROR:",
error
);

showMessage(
error.message ||
"Could not reset credits."
);

return;

}


if(
!data ||
!data.length
){

showMessage(
"User not found or update blocked."
);

return;

}


showMessage(
`${username} credits reset to 0.`,
true
);


await renderUsers();


}catch(error){

console.error(
"RESET EXCEPTION:",
error
);

showMessage(
error.message ||
"Unexpected error."
);

}

}


/* =========================
   RENDER USERS
========================= */

async function renderUsers(){

const box =
$("users");

const loading =
$("loading");


box.innerHTML="";

loading.style.display="block";


try{

const list =
await getUsers();


loading.style.display="none";


if(!list.length){

box.innerHTML =
`
<div class="user">
<small>
No users created yet.
</small>
</div>
`;

return;

}


/*
Create user cards
*/

box.innerHTML =
list.map(
u=>{

const username =
String(u.username);

const balance =
Number(u.balance || 0);


return `

<div class="user">

<div class="row">

<div class="name">
${escapeHTML(username)}
</div>

<div class="balance">
${balance.toLocaleString()}
credits
</div>

</div>


<div
class="row userActions"
>

<button
onclick="quick(
'${escapeJS(username)}',
100
)">
+100
</button>


<button
onclick="quick(
'${escapeJS(username)}',
500
)">
+500
</button>


<button
onclick="quick(
'${escapeJS(username)}',
1000
)">
+1000
</button>


<button
class="danger"
onclick="resetCredits(
'${escapeJS(username)}'
)">
RESET
</button>

</div>

</div>

`;

}
).join("");


}catch(error){

loading.style.display="none";

console.error(
"RENDER ERROR:",
error
);

box.innerHTML =
`
<div class="user">
<div class="msg">
Could not load users.
</div>
</div>
`;

}

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text){

return String(text)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}


/* =========================
   ESCAPE JAVASCRIPT
========================= */

function escapeJS(text){

return String(text)
.replaceAll("\\","\\\\")
.replaceAll("'","\\'")
.replaceAll("\n","\\n")
.replaceAll("\r","\\r");

}


/* =========================
   ENTER KEY LOGIN
========================= */

$("adminPass")
.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){

adminLogin();

}

}
);


/* =========================
   ENTER KEY SET CREDITS
========================= */

$("newAmount")
.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){

setCredits();

}

}
);


/* =========================
   CHECK ADMIN SESSION
========================= */

if(
sessionStorage.getItem(
ADMIN_SESSION_KEY
)==="1"
){

$("login").style.display="none";

$("panel").style.display="block";

renderUsers();

}

</script>

</body>
</html>
