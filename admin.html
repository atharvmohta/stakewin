<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StakeWin Admin</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#050b08;
color:#f5faf7;
font-family:Arial,sans-serif;
padding:20px
}

.card{
max-width:800px;
margin:30px auto;
background:#0d1a13;
border:1px solid #294536;
border-radius:14px;
padding:20px
}

h1{margin-top:0}

input,button{
height:40px;
border-radius:7px;
border:1px solid #294536;
padding:0 12px;
font-size:14px
}

input{
background:#09130e;
color:white;
width:100%;
margin:5px 0
}

button{
background:#20df82;
color:#03130a;
font-weight:900;
cursor:pointer
}

.danger{
background:#ff5265;
color:white
}

.login button{
width:100%;
margin-top:8px
}

.admin{
display:none
}

.user{
border:1px solid #20372a;
border-radius:9px;
padding:12px;
margin:8px 0
}

.row{
display:flex;
gap:7px;
align-items:center;
flex-wrap:wrap
}

.row input{
width:150px;
margin:0
}

.name{
font-weight:900;
font-size:16px;
flex:1
}

.balance{
color:#20df82;
font-weight:900
}

.msg{
min-height:20px;
font-size:12px;
color:#ff5265;
margin:8px 0
}

.success{
color:#20df82
}

.logout{
float:right;
background:#17271f;
color:white
}

small{
color:#789083
}
</style>
</head>

<body>

<div class="card login" id="login">

<h1>
STAKE<span style="color:#20df82">WIN</span> Admin
</h1>

<small>
Virtual-credit demo management
</small>

<input
id="adminUser"
placeholder="Admin username">

<input
id="adminPass"
type="password"
placeholder="Admin password">

<div id="loginMsg" class="msg"></div>

<button onclick="adminLogin()">
LOGIN
</button>

</div>


<div class="card admin" id="panel">

<button
class="logout"
onclick="logoutAdmin()">
LOG OUT
</button>

<h1>Admin Panel</h1>

<small>
Changes sync through Supabase.
</small>

<hr style="border-color:#20372a;margin:18px 0">


<h3>Set Credits</h3>

<input
id="newUser"
placeholder="Username">

<input
id="newAmount"
type="number"
min="0"
placeholder="New balance">

<button onclick="setCredits()">
SET CREDITS
</button>

<div id="actionMsg" class="msg"></div>


<hr style="border-color:#20372a;margin:18px 0">


<h3>Users</h3>

<div id="users"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL=
"https://ljfuowfocmnmowksfuvp.supabase.co";

const SUPABASE_KEY=
"sb_publishable_smUQUWvB4rgac0afKMgmog_5YpFhowH";

const db=
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const ADMIN_USER="admin";
const ADMIN_PASS="#12Atharv";


function adminLogin(){

const u=
document.getElementById("adminUser")
.value.trim();

const p=
document.getElementById("adminPass")
.value;

const msg=
document.getElementById("loginMsg");


if(
u!==ADMIN_USER ||
p!==ADMIN_PASS
){

msg.innerText=
"Invalid admin login.";

return;
}


sessionStorage.setItem(
"stakewin_admin",
"1"
);


document.getElementById("login")
.style.display="none";


document.getElementById("panel")
.style.display="block";


renderUsers();

}


function logoutAdmin(){

sessionStorage.removeItem(
"stakewin_admin"
);

location.reload();

}


async function getUsers(){

const {data,error}=
await db
.from("stakewin_users")
.select("username,balance")
.order("username");


if(error){

console.error(error);

return [];

}


return data || [];

}


async function setCredits(){

const username=
document.getElementById("newUser")
.value.trim();

const amount=
Number(
document.getElementById("newAmount")
.value
);

const msg=
document.getElementById("actionMsg");


msg.className="msg";


if(!username){

msg.innerText=
"Enter a username.";

return;

}


if(
!Number.isFinite(amount) ||
amount<0
){

msg.innerText=
"Enter a valid amount.";

return;

}


const {data,error}=
await db
.from("stakewin_users")
.update({
balance:amount
})
.eq("username",username)
.select("username,balance");


if(error){

console.error(error);

msg.innerText=
"Database error.";

return;

}


if(
!data ||
!data.length
){

msg.innerText=
"User does not exist.";

return;

}


msg.className=
"msg success";

msg.innerText=
`${username} balance set to ${amount} credits.`;


document.getElementById("newUser")
.value="";

document.getElementById("newAmount")
.value="";


renderUsers();

}


async function quick(
username,
amount
){

const users=
await getUsers();


const user=
users.find(
x=>x.username===username
);


if(!user)return;


await db
.from("stakewin_users")
.update({
balance:
Number(user.balance||0)+amount
})
.eq(
"username",
username
);


renderUsers();

}


async function resetCredits(
username
){

if(
!confirm(
`Set ${username}'s credits to 0?`
)
)return;


await db
.from("stakewin_users")
.update({
balance:0
})
.eq(
"username",
username
);


renderUsers();

}


async function renderUsers(){

const box=
document.getElementById("users");


box.innerHTML=
"<small>Loading...</small>";


const list=
await getUsers();


if(!list.length){

box.innerHTML=
"<p><small>No users created yet.</small></p>";

return;

}


box.innerHTML=
list.map(u=>`

<div class="user">

<div class="row">

<div class="name">
${escapeHTML(u.username)}
</div>

<div class="balance">
${Number(
u.balance||0
).toLocaleString()} credits
</div>

</div>


<div
class="row"
style="margin-top:9px"
>

<button
onclick="quick(
'${encodeURIComponent(u.username)}',
100
)"
>
+100
</button>


<button
onclick="quick(
'${encodeURIComponent(u.username)}',
500
)"
>
+500
</button>


<button
onclick="quick(
'${encodeURIComponent(u.username)}',
1000
)"
>
+1000
</button>


<button
class="danger"
onclick="resetCredits(
'${encodeURIComponent(u.username)}'
)"
>
RESET
</button>

</div>

</div>

`).join("");

}


function escapeHTML(text){

return String(text)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}


if(
sessionStorage.getItem(
"stakewin_admin"
)==="1"
){

document.getElementById("login")
.style.display="none";

document.getElementById("panel")
.style.display="block";

renderUsers();

}

</script>

</body>
</html>
